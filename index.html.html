<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MediAssist AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--surface:#fff;--surface2:#f7fafc;
  --border:#e2e8f0;--border2:#cbd5e0;
  --primary:#1a6db5;--primary-dark:#0f4c8a;--primary-light:#e8f1fb;
  --accent:#00b4d8;--accent-light:#e0f7fb;
  --success:#16a34a;--success-light:#dcfce7;
  --warning:#d97706;--warning-light:#fef3c7;
  --danger:#dc2626;--danger-light:#fee2e2;
  --text:#1a202c;--text2:#4a5568;--text3:#718096;
  --radius:12px;--radius-sm:8px;--radius-lg:18px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 4px 24px rgba(0,0,0,.12);
  --font:'DM Sans',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{font-family:var(--font);cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:var(--font)}

/* ── Layout ── */
.app-shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--primary-dark);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px}

/* ── Sidebar ── */
.sidebar-logo{padding:20px 16px 12px;display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text{color:#fff;font-weight:600;font-size:15px;line-height:1.1}
.logo-sub{color:rgba(255,255,255,.5);font-size:10px}
.nav-section{padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.nav-label{color:rgba(255,255,255,.35);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;color:rgba(255,255,255,.65);font-size:13.5px;font-weight:500;cursor:pointer;transition:all .15s;border-left:3px solid transparent;position:relative}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--accent)}
.nav-item .badge{background:var(--danger);color:#fff;font-size:10px;border-radius:99px;padding:1px 6px;margin-left:auto}
.nav-icon{font-size:16px;width:18px;text-align:center}
.sidebar-footer{margin-top:auto;padding:12px 16px;border-top:1px solid rgba(255,255,255,.08)}
.sidebar-user{display:flex;align-items:center;gap:9px;cursor:pointer}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
.sidebar-user-info{flex:1;overflow:hidden}
.sidebar-user-name{color:#fff;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-role{color:rgba(255,255,255,.4);font-size:11px}
.role-switcher{display:flex;gap:6px;padding:12px 16px 8px}
.role-btn{flex:1;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1);border-radius:6px;font-size:10px;font-weight:600;padding:4px 2px;cursor:pointer;transition:all .15s}
.role-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── Topbar ── */
.topbar-title{font-weight:600;font-size:15px;color:var(--text);flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .15s;color:var(--text2)}
.icon-btn:hover{background:var(--border);color:var(--text)}
.pill{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;background:var(--success-light);color:var(--success)}

/* ── Cards ── */
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);padding:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-weight:600;font-size:14px;color:var(--text)}
.card-subtitle{font-size:12px;color:var(--text3);margin-top:1px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:16px 20px}
.stat-card .stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px}
.stat-card .stat-value{font-size:26px;font-weight:700;color:var(--text);line-height:1}
.stat-card .stat-label{font-size:12px;color:var(--text3);margin-top:4px}
.stat-card .stat-change{font-size:12px;font-weight:600;margin-top:6px}
.positive{color:var(--success)}.negative{color:var(--danger)}

/* ── Status badges ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.badge-success{background:var(--success-light);color:var(--success)}
.badge-warning{background:var(--warning-light);color:var(--warning)}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.badge-info{background:var(--primary-light);color:var(--primary)}
.badge-gray{background:var(--surface2);color:var(--text3);border:1px solid var(--border)}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:none}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}.btn-outline:hover{background:var(--primary-light)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--surface2)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.88}
.btn-sm{padding:5px 11px;font-size:12px}

/* ── Chat ── */
.chat-wrap{display:flex;flex-direction:column;height:100%;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.chat-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%)}
.chat-header-info{flex:1}
.chat-header-name{color:#fff;font-weight:600;font-size:15px}
.chat-header-status{color:rgba(255,255,255,.65);font-size:12px;display:flex;align-items:center;gap:5px}
.status-dot{width:7px;height:7px;background:#4ade80;border-radius:50%}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg{max-width:80%;display:flex;flex-direction:column;gap:4px}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end}
.msg-bubble{padding:11px 15px;border-radius:16px;font-size:13.5px;line-height:1.5}
.msg.bot .msg-bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text)}
.msg.user .msg-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg-time{font-size:10px;color:var(--text3)}
.msg.user .msg-time{text-align:right}
.msg-avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.msg-row{display:flex;align-items:flex-end;gap:8px}
.msg.user .msg-row{flex-direction:row-reverse}
.chat-input-area{padding:12px 16px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:10px;align-items:flex-end}
.chat-input{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:9px 13px;font-size:13.5px;resize:none;outline:none;transition:.15s;max-height:90px;line-height:1.4}
.chat-input:focus{border-color:var(--primary)}
.chat-send-btn{width:38px;height:38px;border-radius:10px;background:var(--primary);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.15s}
.chat-send-btn:hover{background:var(--primary-dark)}
.emergency-banner{background:var(--danger);color:#fff;padding:10px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.85}}
.quick-actions{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0}
.quick-chip{background:var(--primary-light);color:var(--primary);border:1px solid var(--primary);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s}
.quick-chip:hover{background:var(--primary);color:#fff}
.typing-dot{width:6px;height:6px;background:var(--text3);border-radius:50%;animation:bounce 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.disclaimer-box{background:var(--warning-light);border:1px solid var(--warning);border-radius:10px;padding:12px 16px;font-size:12.5px;color:var(--text2);margin-bottom:8px;line-height:1.5}

/* ── Tables ── */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);border-bottom:1.5px solid var(--border);background:var(--surface2)}
.data-table td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text2)}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--primary-light)}
.data-table .patient-info{display:flex;align-items:center;gap:9px}

/* ── Appointments ── */
.appt-card{background:var(--surface);border-radius:10px;border:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:14px;transition:.15s}
.appt-card:hover{box-shadow:var(--shadow);border-color:var(--border2)}
.appt-time{background:var(--primary-light);color:var(--primary);border-radius:8px;padding:8px 12px;text-align:center;flex-shrink:0;min-width:58px}
.appt-time .time{font-size:15px;font-weight:700}
.appt-time .ampm{font-size:10px;font-weight:600;text-transform:uppercase}
.appt-info{flex:1}
.appt-doctor{font-weight:600;font-size:14px}
.appt-type{font-size:12px;color:var(--text3);margin-top:1px}
.appt-actions{display:flex;gap:6px}

/* ── Doctor card ── */
.doctor-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;cursor:pointer;transition:.15s}
.doctor-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.doctor-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:600}
.doctor-name{font-weight:600;font-size:14px}
.doctor-spec{font-size:12px;color:var(--text3)}
.doctor-rating{font-size:12px;color:var(--warning);font-weight:600}
.doctor-fee{font-size:13px;font-weight:700;color:var(--primary)}

/* ── Medical records ── */
.record-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.record-item:last-child{border-bottom:none}
.record-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.record-info{flex:1}
.record-name{font-size:13.5px;font-weight:600}
.record-date{font-size:11px;color:var(--text3);margin-top:2px}

/* ── Charts (simple) ── */
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:90px;padding-top:10px}
.bar{flex:1;background:var(--primary-light);border-radius:4px 4px 0 0;position:relative;min-height:4px;transition:.3s}
.bar.active{background:var(--primary)}
.bar-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text3);white-space:nowrap}
.bar-val{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text);font-weight:600;white-space:nowrap}

/* ── Risk indicator ── */
.risk-meter{display:flex;gap:6px;align-items:center}
.risk-block{flex:1;height:8px;border-radius:4px}
.risk-low{background:#86efac}.risk-mid{background:#fcd34d}.risk-high{background:#fca5a5}
.risk-active-low{background:var(--success)}.risk-active-mid{background:var(--warning)}.risk-active-high{background:var(--danger)}

/* ── Notification dot ── */
.notif-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--danger);border-radius:50%}

/* ── Tabs ── */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px}
.tab{padding:9px 18px;font-size:13.5px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab:hover:not(.active){color:var(--text)}

/* ── Auth page ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f4c8a 0%,#1a6db5 40%,#00b4d8 100%)}
.auth-card{background:#fff;border-radius:20px;padding:36px 40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;justify-content:center}
.auth-title{font-size:24px;font-weight:700;color:var(--text);text-align:center;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--text3);text-align:center;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-label{font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block}
.form-input{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:10px 14px;font-size:14px;outline:none;transition:.15s;color:var(--text)}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,109,181,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lang-switch{display:flex;align-items:center;gap:8px;margin-bottom:16px;justify-content:center}
.lang-btn{padding:4px 12px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--text3);transition:.15s}
.lang-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── Landing page ── */
.landing{min-height:100vh;background:#fff;overflow-y:auto}
.landing-nav{display:flex;align-items:center;padding:16px 32px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.landing-nav .nav-links{display:flex;gap:24px;margin-left:auto;align-items:center}
.landing-nav .nav-links a{font-size:14px;color:var(--text2);cursor:pointer;font-weight:500;text-decoration:none}
.hero{padding:64px 32px;text-align:center;background:linear-gradient(135deg,#f0f8ff 0%,#e8f4fd 100%)}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:600;margin-bottom:20px}
.hero h1{font-size:40px;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:16px;max-width:600px;margin-left:auto;margin-right:auto}
.hero h1 span{color:var(--primary)}
.hero p{font-size:16px;color:var(--text2);max-width:500px;margin:0 auto 28px;line-height:1.6}
.hero-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:48px 32px;max-width:960px;margin:0 auto}
.feature-card{padding:24px;border-radius:14px;border:1px solid var(--border);transition:.2s}
.feature-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--primary)}
.feature-icon{font-size:28px;margin-bottom:12px}
.feature-title{font-weight:700;font-size:15px;margin-bottom:6px}
.feature-desc{font-size:13px;color:var(--text2);line-height:1.5}
.testimonial-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 32px 48px;max-width:960px;margin:0 auto}
.testimonial{background:var(--surface2);border-radius:12px;padding:20px;border:1px solid var(--border)}
.test-text{font-size:13.5px;color:var(--text2);line-height:1.6;margin-bottom:12px;font-style:italic}
.test-author{font-weight:600;font-size:13px}.test-role{font-size:11px;color:var(--text3)}
.section-header{text-align:center;padding:40px 32px 20px}
.section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--primary);margin-bottom:8px}
.section-title{font-size:26px;font-weight:700;color:var(--text)}
.cta-section{background:linear-gradient(135deg,var(--primary-dark),var(--primary));padding:48px 32px;text-align:center}
.cta-section h2{color:#fff;font-size:28px;font-weight:700;margin-bottom:12px}
.cta-section p{color:rgba(255,255,255,.8);font-size:14px;margin-bottom:24px}
.landing-footer{padding:24px 32px;background:var(--text);color:rgba(255,255,255,.5);font-size:12px;display:flex;justify-content:space-between}

/* ── Video room ── */
.video-room{background:#0a0a12;border-radius:var(--radius);overflow:hidden;position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.video-main{width:100%;height:100%;object-fit:cover;background:linear-gradient(135deg,#1a1a2e,#16213e)}
.video-main-placeholder{display:flex;flex-direction:column;align-items:center;gap:12px;color:rgba(255,255,255,.6)}
.video-self{position:absolute;bottom:16px;right:16px;width:110px;height:72px;background:linear-gradient(135deg,#0f3460,#533483);border-radius:10px;border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);font-size:11px}
.video-controls{display:flex;gap:10px;justify-content:center;padding:12px}
.video-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.video-btn:hover{background:rgba(255,255,255,.2)}
.video-btn.danger{background:var(--danger)}

/* ── Progress bar ── */
.progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:var(--primary);border-radius:3px;transition:.3s}

/* ── Scroll ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ── Transitions ── */
.page{animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Admin analytics ── */
.analytics-ring{position:relative;display:inline-flex}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-val{font-size:20px;font-weight:700;color:var(--text)}
.ring-sub{font-size:10px;color:var(--text3)}

/* ── Rx card ── */
.rx-card{background:linear-gradient(135deg,#f0f8ff,#e8f4fd);border:1.5px solid var(--primary);border-radius:12px;padding:18px;position:relative}
.rx-watermark{position:absolute;top:12px;right:14px;font-size:28px;font-weight:900;color:var(--primary);opacity:.08;font-style:italic}
.rx-drug{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border2)}
.rx-drug:last-child{border-bottom:none}
.drug-name{font-weight:600;font-size:14px}
.drug-dose{font-size:12px;color:var(--text3);margin-top:2px}

/* ── Schedule grid ── */

// ── Chat logic ──
function addBotMsg(text){
  const now=new Date();
  state.chatMessages.push({from:'bot',text,time:`${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`});
}
function addUserMsg(text){
  const now=new Date();
  state.chatMessages.push({from:'user',text,time:`${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`});
}
function sendQuick(text){state.chatMessages.push({from:'user',text,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});processUserMsg(text);}
function resetChat(){state.chatMessages=[];state.chatStep=0;state.chatData={};state.emergency=false;rerender();}

function sendMsg(){
  const input=$('chatInput');
  if(!input||!input.value.trim()) return;
  const text=input.value.trim();
  input.value='';
  addUserMsg(text);
  processUserMsg(text);
}

function processUserMsg(text){
  const t=T[state.lang];
  // Emergency check
  const lower=text.toLowerCase();
  if(EMERGENCY_KEYWORDS.some(k=>lower.includes(k))){
    state.emergency=true;
    state.chatTyping=true;
    rerender();
    setTimeout(()=>{
      state.chatTyping=false;
      addBotMsg(t.emergencyMsg+'\n\n📞 Emergency: 108\n🏥 Nearest hospital guidance available.\n\nDo you need help finding the nearest hospital?');
      rerender();
    },800);
    return;
  }
  state.chatTyping=true;
  rerender();
  setTimeout(()=>{
    state.chatTyping=false;
    const step=state.chatStep;
    if(step===1){state.chatData.name=text;addBotMsg(t.askAge(text));state.chatStep=2;}
    else if(step===2){state.chatData.age=text;addBotMsg(t.askGender);state.chatStep=3;}
    else if(step===3){state.chatData.gender=text;addBotMsg(t.askSymptoms);state.chatStep=4;}
    else if(step===4){state.chatData.symptoms=text;addBotMsg(t.askDuration);state.chatStep=4.5;}
    else if(step===4.5){state.chatData.duration=text;addBotMsg(t.askSeverity);state.chatStep=4.7;}
    else if(step===4.7){state.chatData.severity=text;addBotMsg(t.askMeds);state.chatStep=4.8;}
    else if(step===4.8){state.chatData.meds=text;addBotMsg(t.askAllergies);state.chatStep=4.9;}
    else if(step===4.9){
      state.chatData.allergies=text;
      addBotMsg(t.processing);
      state.chatTyping=true;rerender();
      setTimeout(()=>{
        state.chatTyping=false;
        const sev=parseInt(state.chatData.severity)||5;
        const risk=sev>=8?'HIGH':sev>=5?'MODERATE':'LOW';
        const recMsg=sev>=8?'⚠ URGENT: Please seek immediate medical attention or visit an ER.':sev>=5?'🩺 I recommend booking a doctor consultation soon.':'💙 You can start with self-care. Stay hydrated, rest well. Monitor symptoms.';
        addBotMsg(`✅ Analysis complete!\n\nBased on your inputs, your risk level appears: **${risk}**\n\n${recMsg}\n\nI've prepared a full symptom summary below. Would you like to book an appointment with a doctor?`);
        state.chatStep=5;
        rerender();
      },1500);
      return;
    }
    else{
      addBotMsg('Is there anything else I can help you with? You can book an appointment or explore our health resources.');
    }
    rerender();
    setTimeout(()=>{const msgs=$('chatMsgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;},100);
  },900);
}

// ── Navigation ──
function go(view){state.view=view;if(view==='app')state.activePage='dashboard';rerender();}
function setPage(page){state.activePage=page;rerender();}
function switchRole(role){state.role=role;state.activePage='dashboard';rerender();}
function setLang(lang){state.lang=lang;rerender();}

function rerender(){
  const html=state.view==='landing'?renderLanding():state.view==='auth'?renderAuth():renderApp();
  $('root').innerHTML=html;
  bindEvents();
  if(state.activePage==='chat'){
    setTimeout(()=>{const msgs=$('chatMsgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;},80);
    if(state.chatMessages.length===0&&state.chatStep===0){
      addBotMsg(T[state.lang].greeting);state.chatStep=1;rerender();
    }
  }
}

function bindEvents(){
  // Auto resize textarea
  const ta=$('chatInput');
  if(ta) ta.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,90)+'px';});
}

// ── Init ──
rerender();
</script>
